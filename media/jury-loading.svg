<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="18 24 92 80" fill="none" role="img" aria-label="Jury">
  <style>
    /* Infinite on purpose: the icon exists only while the work does, and an image's
       animation clock starts when it is loaded, not when it is shown. A finite count plus a
       cached image means every appearance after the first few seconds is a frozen picture. */
    .l1, .l2, .l3 { transform-box: fill-box; transform-origin: left center; }
    .l1 { animation: jury-l1 2.4s cubic-bezier(.4, 0, .2, 1) infinite; }
    .l2 { animation: jury-l2 2.4s cubic-bezier(.4, 0, .2, 1) infinite; }
    .l3 { animation: jury-l3 2.4s cubic-bezier(.4, 0, .2, 1) infinite; }
    .f1 { animation: jury-f1 2.4s ease-out infinite; }
    .f2 { animation: jury-f2 2.4s ease-out infinite; }
    .f3 { animation: jury-f3 2.4s ease-out infinite; }
    @keyframes jury-l1 { 0% { transform: scaleX(0); opacity: 1 } 15%, 85% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
    @keyframes jury-l2 { 0%, 25% { transform: scaleX(0); opacity: 1 } 40%, 85% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
    @keyframes jury-l3 { 0%, 50% { transform: scaleX(0); opacity: 1 } 65%, 85% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
    @keyframes jury-f1 { 0% { opacity: 0 } 8%, 85% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes jury-f2 { 0%, 25% { opacity: 0 } 33%, 85% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes jury-f3 { 0%, 50% { opacity: 0 } 58%, 85% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .l1, .l2, .l3, .f1, .f2, .f3 { animation: none; } }
  </style>
  <g stroke="currentColor" stroke-width="4" opacity=".35">
    <path d="M32 47V57M32 73V81"></path>
    <circle cx="32" cy="38" r="7"></circle>
    <circle cx="32" cy="64" r="7"></circle>
    <circle cx="32" cy="90" r="7"></circle>
  </g>
  <circle class="f1" cx="32" cy="38" r="9" fill="currentColor"></circle>
  <circle class="f2" cx="32" cy="64" r="9" fill="currentColor"></circle>
  <circle class="f3" cx="32" cy="90" r="9" fill="currentColor"></circle>
  <rect class="l1" x="50" y="33" width="50" height="10" rx="5" fill="currentColor"></rect>
  <rect class="l2" x="58" y="59" width="40" height="10" rx="5" fill="currentColor"></rect>
  <rect class="l3" x="66" y="85" width="30" height="10" rx="5" fill="currentColor"></rect>
</svg>
