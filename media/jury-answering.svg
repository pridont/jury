<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Jury">
  <style>
    .lead { transform-box: fill-box; transform-origin: center; animation: jury-breathe 1.6s ease-in-out 5; }
    @keyframes jury-breathe { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.8); opacity: .6 } }
    svg > g { animation: jury-panel 8s step-end forwards; }
    @keyframes jury-panel { 0% { opacity: .5 } 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .lead { animation: none; } svg > g { animation: none; opacity: 1; } }
  </style>
  <circle class="lead" cx="12" cy="4.6" r="2.7" fill="currentColor"></circle>
  <g opacity=".5">
  <circle cx="4.4" cy="11.6" r="1.8" fill="currentColor"></circle>
  <circle cx="9.5" cy="11.6" r="1.8" fill="currentColor"></circle>
  <circle cx="14.5" cy="11.6" r="1.8" fill="currentColor"></circle>
  <circle cx="19.6" cy="11.6" r="1.8" fill="currentColor"></circle>
  </g>
  <path d="M3.5 18H20.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
</svg>