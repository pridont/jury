name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # The fixtures are generated from real git rather than hand-written, so the tests need
      # an identity to commit with.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: npm run check
      - run: npm test
      - run: npm run build

  # Windows has never been tried. `git rev-parse --show-toplevel` answers with forward
  # slashes while `fs.realpath` answers with backslashes, and several tests compare the two,
  # so this is expected to have something to say. It reports rather than gates until someone
  # has actually read what it says.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: npm run check
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes @vscode/vsce package --out change-stack.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: change-stack-vsix
          path: change-stack.vsix
